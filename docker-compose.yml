  #     - dungeoneer-net
  #   deploy:
  #     replicas: 1
  #     update_config:
  #       order: start-first
  #     restart_policy:
  #       condition: any

networks:
  dungeoneer-net:
    driver: overlay # Rede especial do Swarm para comunicação segura entre containers

volumes:
  db-data: